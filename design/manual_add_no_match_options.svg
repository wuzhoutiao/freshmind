<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#24413A" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #F4F7EF; }
      .panel { fill: #FFFFFF; filter: url(#shadow); }
      .title { font: 700 28px Arial, sans-serif; fill: #315F4B; }
      .label { font: 700 18px Arial, sans-serif; fill: #315F4B; }
      .hint { font: 400 16px Arial, sans-serif; fill: #71837A; }
      .search { fill: #FFFFFF; stroke: #E1E8DD; stroke-width: 2; }
      .dropdown { fill: #FFFFFF; stroke: #E4EAE0; stroke-width: 1; }
      .result { font: 400 20px Arial, sans-serif; fill: #2C3E35; }
      .action { font: 700 20px Arial, sans-serif; fill: #2E6A4B; }
      .muted { font: 400 18px Arial, sans-serif; fill: #6E7F76; }
      .divider { stroke: #ECECEC; stroke-width: 1; }
      .plusCircle { fill: #79B36B; }
      .plus { stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; }
      .chip { fill: #EEF7EA; stroke: #BFDDB6; stroke-width: 1.5; }
      .pressed { fill: #F5FBF2; }
      .button { fill: #FFFFFF; stroke: #BFDDB6; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="860"/>
  <text class="title" x="64" y="64">No-match manual add UI options</text>
  <text class="hint" x="64" y="94">Search term example: dragonfruit leaves</text>

  <!-- Option 1 -->
  <g transform="translate(64 132)">
    <rect class="panel" x="0" y="0" width="560" height="300" rx="18"/>
    <text class="label" x="30" y="42">1. Result-row style</text>
    <text class="hint" x="30" y="68">Looks like a selectable search result, with a familiar add icon.</text>
    <rect class="search" x="30" y="94" width="500" height="44" rx="22"/>
    <circle cx="56" cy="116" r="8" fill="none" stroke="#6E7F76" stroke-width="3"/>
    <line x1="62" y1="122" x2="72" y2="132" stroke="#6E7F76" stroke-width="3" stroke-linecap="round"/>
    <text class="result" x="90" y="123">dragonfruit leaves</text>
    <rect class="dropdown" x="30" y="150" width="500" height="76" rx="8"/>
    <text class="action" x="54" y="195">Add "dragonfruit leaves" manually</text>
    <circle class="plusCircle" cx="500" cy="188" r="14"/>
    <line class="plus" x1="493" y1="188" x2="507" y2="188"/>
    <line class="plus" x1="500" y1="181" x2="500" y2="195"/>
  </g>

  <!-- Option 2 -->
  <g transform="translate(656 132)">
    <rect class="panel" x="0" y="0" width="560" height="300" rx="18"/>
    <text class="label" x="30" y="42">2. Emphasized text + icon</text>
    <text class="hint" x="30" y="68">Small change, but the color and plus icon signal action.</text>
    <rect class="search" x="30" y="94" width="500" height="44" rx="22"/>
    <circle cx="56" cy="116" r="8" fill="none" stroke="#6E7F76" stroke-width="3"/>
    <line x1="62" y1="122" x2="72" y2="132" stroke="#6E7F76" stroke-width="3" stroke-linecap="round"/>
    <text class="result" x="90" y="123">dragonfruit leaves</text>
    <rect class="dropdown" x="30" y="150" width="500" height="76" rx="8"/>
    <circle class="plusCircle" cx="58" cy="188" r="13"/>
    <line class="plus" x1="52" y1="188" x2="64" y2="188"/>
    <line class="plus" x1="58" y1="182" x2="58" y2="194"/>
    <text class="action" x="86" y="195">Add "dragonfruit leaves" manually?</text>
  </g>

  <!-- Option 3 -->
  <g transform="translate(64 486)">
    <rect class="panel" x="0" y="0" width="560" height="300" rx="18"/>
    <text class="label" x="30" y="42">3. Soft button row</text>
    <text class="hint" x="30" y="68">A gentle background and border make the whole row feel tappable.</text>
    <rect class="search" x="30" y="94" width="500" height="44" rx="22"/>
    <circle cx="56" cy="116" r="8" fill="none" stroke="#6E7F76" stroke-width="3"/>
    <line x1="62" y1="122" x2="72" y2="132" stroke="#6E7F76" stroke-width="3" stroke-linecap="round"/>
    <text class="result" x="90" y="123">dragonfruit leaves</text>
    <rect class="dropdown" x="30" y="150" width="500" height="92" rx="8"/>
    <rect class="chip" x="46" y="166" width="468" height="54" rx="8"/>
    <text class="action" x="68" y="200">Add "dragonfruit leaves" manually</text>
    <path d="M488 188 L498 198 L488 208" fill="none" stroke="#2E6A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Option 4 -->
  <g transform="translate(656 486)">
    <rect class="panel" x="0" y="0" width="560" height="300" rx="18"/>
    <text class="label" x="30" y="42">4. Empty state + clear button</text>
    <text class="hint" x="30" y="68">Most explicit, but taller than the others.</text>
    <rect class="search" x="30" y="94" width="500" height="44" rx="22"/>
    <circle cx="56" cy="116" r="8" fill="none" stroke="#6E7F76" stroke-width="3"/>
    <line x1="62" y1="122" x2="72" y2="132" stroke="#6E7F76" stroke-width="3" stroke-linecap="round"/>
    <text class="result" x="90" y="123">dragonfruit leaves</text>
    <rect class="dropdown" x="30" y="150" width="500" height="120" rx="8"/>
    <text class="muted" x="54" y="188">No matches found</text>
    <rect class="button" x="54" y="206" width="314" height="42" rx="8"/>
    <circle class="plusCircle" cx="78" cy="227" r="11"/>
    <line class="plus" x1="73" y1="227" x2="83" y2="227"/>
    <line class="plus" x1="78" y1="222" x2="78" y2="232"/>
    <text class="action" x="98" y="234">Add "dragonfruit leaves"</text>
  </g>
</svg>
